version: "3.8"

services:
  chatwoot:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: "development:test"
        RAILS_ENV: "production"
        RAILS_SERVE_STATIC_FILES: "true"
    image: chatwoot-local:latest
    container_name: dep-chatwoot
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.selfhost
    volumes:
      - storage_data:/app/storage
      - ./public/absher:/app/public/absher
    ports:
      - "3000:3000"
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    restart: unless-stopped

  sidekiq:
    platform: linux/amd64
    image: chatwoot-local:latest
    container_name: dep-sidekiq
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.selfhost
    volumes:
      - storage_data:/app/storage
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: dep-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: dep-redis
    command: ["redis-server"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: dep-mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  rag-service:
    build: ./services/rag-service
    container_name: dep-rag-service
    environment:
      - RAG_DB_URL=${RAG_DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres}
      - RAG_VECTOR_SCHEMA=rag
    depends_on:
      - postgres
      - redis
    # Do not expose any host ports; internal network only

volumes:
  storage_data:
    external: true
    name: dep_storage_data
  postgres_data:
    external: true
    name: dep_postgres_data
  redis_data:
    external: true
    name: dep_redis_data
