<!DOCTYPE html>
<html lang="en">
<head>

  <title>Chatwoot SDK Test</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 2rem; }
  </style>
</head>
<body>
  <h1>Chatwoot SDK Test</h1>
  <p>This page loads the Chatwoot web SDK from http://localhost:3000. Ensure your Chatwoot server is running.</p>

  <script>
  (function(d,t) {
    var BASE_URL="http://localhost:3000";
    var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
    g.src=BASE_URL+"/packs/js/sdk.js";
    g.async = true;
    s.parentNode.insertBefore(g,s);
    g.onload=function(){
      window.chatwootSDK.run({
        websiteToken: '4Jix4GLYqEZfybQfhEZeSp5a',
        baseUrl: BASE_URL
      })
    }
  })(document,"script");
  </script>
</body>
